<mat-toolbar class="mat-elevation-z1 app-toolbar" color="primary" fxFlex="grow">
  <mat-toolbar-row></mat-toolbar-row>
  <mat-toolbar-row></mat-toolbar-row>
</mat-toolbar>
<div class="floating-container" fxLayout="row" fxLayoutAlign="center center" fxFill>
  <mat-card class="card-1-1">
<mat-sidenav-container fxLayout="row" fxFill mode="push">
  <mat-sidenav-content fxFill>   
    <mat-divider [inset]="true"></mat-divider>    
        <div fxLayout="row" fxFill>
          <div class="inbox-container employee my-documents" fxFlex.lt-md="100" fxFlex.gt-sm="30" fxFill>
            <mat-toolbar class="inbox-toolbar" color="grey" fxLayout="row" fxLayoutAlign="start center">
              <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between center" fxFill>
                <div class="mat-avatar" fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="16px">
                  <div class="toolbar-line container-ou" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px">
                    <button mat-icon-button (click)="goEmployeeDetail()" title="Volver">
                      <mat-icon class="fa-lg" fontSet="fa" fontIcon="fa-arrow-left"></mat-icon>
                    </button>
                    <div class="title" fxLayout="column" fxLayoutAlign="center start">
                      <h3>{{emp?.lastName}}, {{emp?.name}}</h3>
                      <h5>ID Fiscal: {{emp?.cuil | mask: empFiscalIdMask}}</h5>
                    </div>
                  </div>
                </div>
                <button mat-icon-button  title="Actualizar" (click)="refresh()">
                  <mat-icon class="fa-lg" fontSet="fa" fontIcon="fa-redo"></mat-icon>
                </button>
              </mat-toolbar-row>
            </mat-toolbar>
            <mat-toolbar class="inbox-toolbar" color="grey" fxLayout="row" fxLayoutAlign="start center">
              <mat-toolbar-row>
                <div class="mat-avatar" fxLayout="row" fxLayoutAlign="space-between center">
                  <div class="toolbar-line" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px">
                    <mat-icon class="fa-lg" fontSet="fa" fontIcon="fa-calendar-alt">
                    </mat-icon>
                     <h3>Solicitudes</h3> 
                  </div>
                </div>
                <div class="container-filter">
                <button [ngClass]="{ 'filter-state': selectedLeaveStateFind != 5, 'filter-state-small': (selectedLeaveStateFind == 5 ||  selectedLeaveStateFind == 6)}" mat-stroked-button color="primary"  [disabled]="isLoading" >
                  <mat-icon  style="display: contents;" class="fa-lg" fontSet="fas" fontIcon="fa-filter"></mat-icon>
                  <mat-select class="invisible-item" #selectState (click)="$event.stopPropagation()" (keydown)="loadRequestToToApprovers()"
                    [(ngModel)]="selectedLeaveStateFind">
                    <mat-option *ngFor="let state of statesFilters" [value]="state.key" (click)="loadRequestToToApprovers()" (keydown)="loadRequestToToApprovers()">
                      {{state?.value}}
                    </mat-option>
                  </mat-select>
                </button>
              </div>
              </mat-toolbar-row>
            </mat-toolbar>
            <mat-divider class="false-divider" [inset]="true"></mat-divider>
          <div class="leave_container" [class]="selectedLeave ? 'visible' : ''" fxLayout="column">            
            <!-- Empty (app chapa) -->
            <div class="window-spinner" *ngIf="isLoading">
              <mat-progress-spinner mode="indeterminate" color="primary">
              </mat-progress-spinner>
            </div>
            <app-chapa [className]="'info-empty'" [icon]="'fa-meh'"
              [text]="' Sin licencias solicitadas...'" *ngIf="(leaveRequests?.length < 1 ) && !isLoading">
            </app-chapa>
            <div class="leave_items" fxLayout="column" fxLayoutGap="16px"
              *ngIf="leaveRequests?.length > 0 && !isLoading">
              <span class="leave_items-item" *ngFor="let leave of leaveRequests"
                [ngClass]="getClassNameColor(leave.id)">
                <div class="content mat-card mat-elevation-z2"
                  [ngClass]="{'selected' : leave?.id === selectedLeave?.id}" matRipple fxLayout="row"
                  fxLayoutAlign="start center" (click)="selectLeave(leave)" (keydown)="selectLeave(leave)">
                  <mat-icon class="leave_item-icon" [ngClass]="leave.loading ? 'fa-xs fa-spin' : 'fa-lg'" fontSet="fa"
                    [fontIcon]="leave.loading ? 'fa-spinner-third':getTypeRequestIcon(leave.id)" fxLayout="row"
                    fxLayoutAlign="center center">
                  </mat-icon>
                  <div class="item-data" fxLayout="column">
                    <b [title]="'Solicitud de ' + getTypeRequestName(leave.id)" #listItem>
                      {{'Solicitud de ' + getTypeRequestName(leave.id)}}
                    </b>
                    <span>{{ leave.daysConsumed +
                      ' días '  + getTypeLeave(leave.id) + '  el '+
                      (getDateRequets(leave.id) | date:'dd/MM/yyyy')}}
                    </span>
                  </div>
                  <div class="leave_item-status_icon" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="4px"
                    [title]="getStatusName(leave.id)">
                    <mat-icon fontSet="fa" fontIcon={{getTypeRequestDetailIcon(leave.id)}}></mat-icon>
                  </div>
                </div>
              </span>
            </div>
            <div class="main-action" fxLayout="row">
              <app-cs-paginator fxFill fxLayoutAlign="center center" [hidden]="leaveRequests?.length == 0" [pageCount]="itemsCount" [(pageIndex)]="pageIndex"
              (pageChanged)="selectedPageChanged($event)">
            </app-cs-paginator>
          </div>
          </div>
          </div>
          <mat-divider [vertical]="true"></mat-divider>
          <div class="detail" fxFlex.lt-md="100" fxFlex.gt-sm="70" fxFill>
            <router-outlet (activate)="subscribeReload($event)"> </router-outlet>
          </div>
        </div>     
  </mat-sidenav-content>
</mat-sidenav-container>
  </mat-card>
</div>
