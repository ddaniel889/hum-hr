    <script>
        document.getElementById("noCompatible").style.display = "none";
        const ua = navigator.userAgent;
        var tem;
        var M = ua.match(/(Googlebot|opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
        if (/trident/i.test(M[1])) {
            // estoy en ie no funciona angular
            document.getElementById("noCompatible").style.display = "block";
        }
    </script>
